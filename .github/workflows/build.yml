name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download CodeBuddy CLI
        run: node scripts/prepare-vendor.js
        shell: bash

      - name: Verify bundled CLI version
        shell: bash
        run: |
          node -e '
            const want = require("./package.json").codebuddyCliVersion;
            const have = require("./vendor/codebuddy-code/package.json").version;
            if (want !== have) {
              console.error(`bundled CLI ${have} does not match pinned ${want}`);
              process.exit(1);
            }
            console.log(`✓ CLI ${have}`);
          '

      - name: Build Windows packages
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.msi
          retention-days: 30

      - name: Extract changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract the section for this tag from CHANGELOG.md
          SECTION=$(sed -n "/## \[${TAG#v}\]/,/## \[/p" CHANGELOG.md | sed '$d' | sed '1d')
          if [ -z "$SECTION" ]; then
            SECTION="Release ${TAG}"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc.') || contains(github.ref, '-beta.') || contains(github.ref, '-alpha.') }}
          files: |
            dist/*.exe
            dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
